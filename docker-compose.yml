services:
  catalogdb:
    image: mongo:latest
  basketdb:
    image: redis:alpine

  discountdb:
    image: postgres:18-alpine

  orderdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
  identitydb:
    image: mcr.microsoft.com/mssql/server:2022-latest
  rabbitmq:
    image: rabbitmq:3-management-alpine

  pgadmin:
    image: dpage/pgadmin4
  catalog:
    image: ${DOCKER_REGISTRY-}catalog
    build:
      context: .
      dockerfile: Services/Catalog/Dockerfile

  basket:
    image: ${DOCKER_REGISTRY-}basket
    build:
      context: .
      dockerfile: Services/Basket/Dockerfile

  discount:
    image: ${DOCKER_REGISTRY-}discount
    build:
      context: .
      dockerfile: Services/Discount/Dockerfile

  ordering:
    image: ${DOCKER_REGISTRY-}ordering
    build:
      context: .
      dockerfile: Services/Ordering/Dockerfile

  payment:
    image: ${DOCKER_REGISTRY-}payment
    build:
      context: .
      dockerfile: Services/Payment/Dockerfile

  identity:
    image: ${DOCKER_REGISTRY-}identity
    build:
      context: .
      dockerfile: Services/Identity/Dockerfile

  portainer:
    image: portainer/portainer-ce
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0

  ocelot.apigateway:
    image: ${DOCKER_REGISTRY-}ocelot.apigateway
    build:
      context: .
      dockerfile: ApiGateway/ApiGateway/Dockerfile

volumes:
  mongo_data:
  portainer_data:
  postgres_data:
  orderdb_data:
  identitydb_data:
  pgadmin_data:
  elasticsearch-data:
